# Local Postgres for development. Production and previews use Neon.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: recycleiq
      POSTGRES_PASSWORD: recycleiq
      POSTGRES_DB: recycleiq
    ports:
      # Host port: set DB_PORT in .env if 5432 is taken (e.g. by a Postgres already installed).
      - '${DB_PORT:-5432}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
